[project]
name = "trabalho-final-fase-1"
version = "0.1.0"
description = "Pipeline de Machine Learning e API FastAPI para predição de churn Telco"
authors = []
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
readme = "README.md"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = ">=0.141.1,<1"
uvicorn = ">=0.52.1,<1"
pydantic = ">=2.13.4,<3"
PyJWT = ">=2.10.1,<3"
joblib = ">=1.5.3,<2"
numpy = ">=2.5.2,<3"
pandas = ">=2.2,<3"
# Preserve the sklearn version recorded by the supplied model artifacts.
scikit-learn = "1.9.0"
scipy = ">=1.18.0,<2"
mlflow = ">=3.15.1,<4"
python-dotenv = ">=1.2.2,<2"
python-json-logger = ">=3.3,<4"
prometheus-client = ">=0.21,<1"
prometheus-fastapi-instrumentator = ">=8.1,<9"
kaggle = "2.2.4"
# Direct imports from Starlette are used by the API middleware.
starlette = ">=0.40,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1,<8"
pytest-mock = ">=3.15.1,<4"
ruff = ">=0.16.2,<1"
flake8 = ">=7.3,<8"
# HTTP clients used by FastAPI TestClient.
httpx = ">=0.28.1,<1"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.3,<8"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<1"
fairlearn = ">=0.14,<1"
statsmodels = ">=0.14.6,<1"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_model_metrics.py" = ["N806"]
