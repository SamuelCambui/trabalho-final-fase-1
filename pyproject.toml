[project]
name = "trabalho-final-fase-1"
version = "0.1.0"
description = "Pipeline de Machine Learning e API FastAPI para predição de churn Telco"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=0.1.0",
    "jinja2>=3.1.6",
    "PyJWT>=2.10.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.52.1",
    "kaggle==2.2.4",
]


[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
]
