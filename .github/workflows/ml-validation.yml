name: ML Quality Gate

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  ml-validation:

    name: Validar Dados e Modelo

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ==========================================================
      # UV
      # ==========================================================

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ==========================================================
      # VALIDAR UV
      # ==========================================================

      - name: Verificar uv
        run: |
          uv --version


      # ==========================================================
      # DEPENDÊNCIAS
      # ==========================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

         
      - name: Configurar Kaggle
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_JSON" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Preparar dataset
        run: |
          uv run python scripts/setup.py      


      # ==========================================================
      # TESTES
      # ==========================================================

      - name: Executar testes
        run: |
          uv run pytest -v
      # ==========================================================
      # QUALIDADE DO MODELO
      # ==========================================================

      - name: Validar métricas do modelo
        run: |
          pytest tests/test_model_metrics.py -v