name: ML Quality Gate

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  ml-validation:

    name: Validar Dados e Modelo

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ==========================================================
      # UV
      # ==========================================================

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # ==========================================================
      # VALIDAR UV
      # ==========================================================

      - name: Verificar uv
        run: |
          uv --version


      # ==========================================================
      # DEPENDÊNCIAS
      # ==========================================================

      - name: Instalar dependências
        run: |
          uv sync --dev


      # ==========================================================
      # KAGGLE
      # ==========================================================

      - name: Configurar credenciais do Kaggle
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          if [ -z "$KAGGLE_JSON" ]; then
            echo "[ERRO] Secret KAGGLE_JSON não configurado."
            exit 1
          fi

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
          printf '%s' "$KAGGLE_JSON" > "$GITHUB_WORKSPACE/kaggle.json"

          chmod 600 "$HOME/.kaggle/kaggle.json"
          chmod 600 "$GITHUB_WORKSPACE/kaggle.json"

          echo "[OK] Credenciais do Kaggle configuradas."


      # ==========================================================
      # PREPARAR DATASET
      # ==========================================================

      - name: Preparar projeto
        run: |
          uv run python scripts/setup.py


      # ==========================================================
      # VALIDAR DATASET
      # ==========================================================

      - name: Validar dataset
        run: |
          echo "Verificando dataset..."

          test -f "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"

          echo "[OK] Dataset encontrado."

          ls -lh data/raw/


      # ==========================================================
      # TREINAR MODELO
      # ==========================================================

      - name: Treinar modelo
        run: |
          uv run python -m src.train_model.train


      # ==========================================================
      # VALIDAR MODELO GERADO
      # ==========================================================

      - name: Validar modelo
        run: |
          echo "Verificando modelo..."

          test -f "models/model.joblib"

          echo "[OK] Modelo encontrado."

          ls -lh models/model.joblib


      # ==========================================================
      # TESTES
      # ==========================================================

      - name: Executar testes
        run: |
          uv run pytest tests/ -v


      # ==========================================================
      # QUALIDADE DO MODELO
      # ==========================================================

      - name: Validar métricas do modelo
        run: |
          uv run pytest tests/test_model_metrics.py -v