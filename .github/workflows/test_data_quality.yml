name: Data Quality

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  data-quality:

    name: Qualidade dos Dados

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verificar uv
        run: |
          uv --version

      - name: Instalar dependências
        run: |
          uv sync --dev

      - name: Configurar credenciais do Kaggle
        env:
            KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
            mkdir -p ~/.kaggle
            printf '%s' "$KAGGLE_JSON" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json

      - name: Preparar dataset
        run: |
          uv run python scripts/setup.py

      - name: Validar dataset
        run: |
          uv run pytest tests/test_data_quality.py -v